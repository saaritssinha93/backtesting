# Safe default: alerts are grouped and retained in the local Alertmanager UI.
# Configure a real receiver using alertmanager.receiver.example.yml before LIVE.
global:
  resolve_timeout: 5m

route:
  receiver: local-ui-only
  group_by: [alertname, service, strategy, mode]
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="P0"']
      receiver: local-ui-only
      group_wait: 0s
      repeat_interval: 5m
    - matchers: ['severity="P1"']
      receiver: local-ui-only
      repeat_interval: 30m

inhibit_rules:
  - source_matchers: ['alertname="TradingTelemetryTargetDown"']
    target_matchers: ['dependency="telemetry"']
    equal: [service]

receivers:
  - name: local-ui-only

