global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    platform: eqidv2

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]

  # Alloy owns the application scrape and OTLP ingestion. Keeping that path in
  # one place prevents duplicate samples when an instrumented service exposes
  # both /metrics and OTLP.
